<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found</title>
<meta name="robots" content="noindex">
<script>
  // Old Inkboard site: /inkboard/<path> moved to https://penrill.com/<path>
  var m = location.pathname.match(/^\/inkboard(\/.*)?$/)
  if (m) location.replace('https://penrill.com' + (m[1] || '/') + location.search + location.hash)
</script>
</head>
<body><p>Not found. Looking for Inkboard? It is now <a href="https://penrill.com/">Penrill</a>.</p></body>
</html>
